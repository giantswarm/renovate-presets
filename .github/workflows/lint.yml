name: Lint
on:
  pull_request:
  workflow_dispatch:

jobs:
  debug_info:
    name: Debug info
    runs-on: ubuntu-26.04
    steps:
      - name: Print github context JSON
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
  validate:
    name: Validate
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - name: Install npm package
        run: "npm install --global json5"
      - name: Validate JSON5 syntax
        run: |
          EXIT_CODE=0
          for f in *.json5; do
            echo "Validating ${f}"
            json5 --validate ${f}
            if [[ "$?" != "0" ]]; then
              EXIT_CODE=1
            fi
          done
          exit ${EXIT_CODE}
      - name: Validate Renovate config
        run: |
          # repo: renovatebot/renovate
          RENOVATE_VERSION=44.252.6
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict *.json5
